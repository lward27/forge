forgePostgresql:
  name: forge-postgresql
  replicaCount: 0

  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  auth:
    database: "forge_platform"
    existingSecret: "forge-postgresql-credentials"
    passwordKey: "POSTGRES_PASSWORD"
    databaseKey: "POSTGRES_DB"
    userKey: "POSTGRES_USER"
    databaseUrlKey: "DATABASE_URL"

  service:
    type: ClusterIP
    port: 5432
    primarySelector: forge-postgresql-next

  persistence:
    size: 8Gi
    storageClass: local-path

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

  # Optional side-by-side target for a PostgreSQL major-version migration.
  # Keep disabled until a restored copy has been validated and the cutover is planned.
  migrationTarget:
    enabled: true
    name: forge-postgresql-next
    image:
      repository: docker.io/library/postgres
      tag: "18.7@sha256:32f5fdbf4d27ebe0d4552313126a593400f40b21bff207e43617b2305838bce3"
      pullPolicy: IfNotPresent
    dataDirectory: /var/lib/postgresql/18/docker
    persistence:
      size: 8Gi
      storageClass: local-path
